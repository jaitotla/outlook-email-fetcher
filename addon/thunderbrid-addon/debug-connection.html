<!DOCTYPE html>
<html>
<head>
  <title>OpenMailBot - Connection Debugger</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: #0066cc; color: white; border: none; cursor: pointer; }
    button:hover { background: #0052a3; }
    .result { margin-top: 20px; padding: 15px; border-radius: 5px; white-space: pre-wrap; font-family: monospace; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <h1>🔧 OpenMailBot Connection Debugger</h1>
  <p>Use this tool to test your agent server connection and validate API keys.</p>
  
  <h2>1. Agent Server</h2>
  <input type="text" id="agentUrl" placeholder="Agent URL (e.g., http://localhost:5051)" value="http://localhost:5051">
  <button onclick="testHandshake()">✅ Test Agent Connection</button>
  <div id="handshakeResult" class="result" style="display:none;"></div>

  <h2>2. Validate API Key</h2>
  <label>Provider Type:</label>
  <select id="providerType">
    <option value="llm">LLM</option>
    <option value="emb">Embedding</option>
  </select>
  
  <label>Provider:</label>
  <select id="provider">
    <option value="openai">OpenAI</option>
    <option value="anthropic">Anthropic</option>
    <option value="groq">Groq</option>
    <option value="ollama">Ollama</option>
  </select>
  
  <input type="password" id="apiKey" placeholder="API Key">
  <input type="text" id="baseUrl" placeholder="Base URL (for Ollama, e.g., http://localhost:11434)">
  
  <button onclick="validateProvider()">🔍 Validate & Fetch Models</button>
  <div id="validateResult" class="result" style="display:none;"></div>

  <script>
    async function testHandshake() {
      const resultDiv = document.getElementById('handshakeResult');
      const agentUrl = document.getElementById('agentUrl').value.trim();
      
      if (!agentUrl) {
        showResult('handshakeResult', 'error', '❌ Please enter an agent URL');
        return;
      }

      // Auto-convert 0.0.0.0 to localhost
      const originalUrl = agentUrl;
      const convertedUrl = agentUrl.replace(/:\/\/0\.0\.0\.0:/g, '://localhost:');
      
      const endpoint = `${convertedUrl}/handshake`;
      
      showResult('handshakeResult', 'info', `🔄 Testing connection to: ${endpoint}\n${originalUrl !== convertedUrl ? `(converted from ${originalUrl})` : ''}`);
      
      try {
        const resp = await fetch(endpoint, {
          method: 'GET',
          signal: AbortSignal.timeout(10000)
        });
        
        if (!resp.ok) {
          const errorText = await resp.text();
          showResult('handshakeResult', 'error', `❌ HTTP ${resp.status}: ${errorText}`);
          return;
        }
        
        const data = await resp.json();
        showResult('handshakeResult', 'success', `✅ Connection successful!\n\nResponse:\n${JSON.stringify(data, null, 2)}`);
      } catch (err) {
        showResult('handshakeResult', 'error', `❌ Connection failed: ${err.message}\n\nTroubleshooting:\n• Is the agent running? (python main.py)\n• Is it listening on ${convertedUrl}?\n• Check CORS settings if needed`);
      }
    }

    async function validateProvider() {
      const resultDiv = document.getElementById('validateResult');
      const agentUrl = document.getElementById('agentUrl').value.trim();
      const providerType = document.getElementById('providerType').value;
      const provider = document.getElementById('provider').value;
      const apiKey = document.getElementById('apiKey').value.trim();
      const baseUrl = document.getElementById('baseUrl').value.trim();
      
      if (!agentUrl) {
        showResult('validateResult', 'error', '❌ Please enter an agent URL');
        return;
      }

      // Auto-convert 0.0.0.0 to localhost
      const convertedUrl = agentUrl.replace(/:\/\/0\.0\.0\.0:/g, '://localhost:');
      const endpoint = `${convertedUrl}/api/validate-provider`;
      
      const requestBody = {
        provider_type: providerType,
        provider: provider,
        api_key: apiKey,
        base_url: baseUrl,
        model: ""
      };
      
      showResult('validateResult', 'info', `🔄 Validating ${provider}...\n\nEndpoint: ${endpoint}\nRequest:\n${JSON.stringify(requestBody, null, 2)}`);
      
      try {
        const resp = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody),
          signal: AbortSignal.timeout(15000)
        });
        
        if (!resp.ok) {
          const errorText = await resp.text();
          showResult('validateResult', 'error', `❌ HTTP ${resp.status}: ${errorText.substring(0, 500)}`);
          return;
        }
        
        const data = await resp.json();
        
        if (data.valid) {
          showResult('validateResult', 'success', `✅ API key is valid!\n\n${data.models && data.models.length > 0 ? `Found ${data.models.length} model(s):\n${data.models.join('\n')}` : 'No models returned'}\n\nFull response:\n${JSON.stringify(data, null, 2)}`);
        } else {
          showResult('validateResult', 'error', `❌ ${data.message || 'Invalid API key'}\n\nFull response:\n${JSON.stringify(data, null, 2)}`);
        }
      } catch (err) {
        showResult('validateResult', 'error', `❌ Request failed: ${err.message}`);
      }
    }

    function showResult(divId, type, message) {
      const div = document.getElementById(divId);
      div.className = `result ${type}`;
      div.textContent = message;
      div.style.display = 'block';
    }
  </script>
</body>
</html>
