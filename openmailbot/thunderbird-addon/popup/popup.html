<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenMailBot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🤖 OpenMailBot</h1>
      <p class="subtitle">AI Email Assistant</p>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Processing...</p>
    </div>

    <!-- Error State -->
    <div id="error" class="error hidden">
      <p id="errorMessage"></p>
      <button id="retryBtn" class="btn btn-secondary">Retry</button>
    </div>

    <!-- Main Content -->
    <div id="content" class="content">
      <!-- Quick Actions -->
      <div class="section">
        <h2>Quick Actions</h2>
        <div class="actions">
          <button id="summarizeBtn" class="btn btn-primary">
            📝 Summarize Email
          </button>
          <button id="generateReplyBtn" class="btn btn-primary">
            ✍️ Generate Reply
          </button>
          <button id="findRelatedBtn" class="btn btn-secondary">
            🔍 Find Related
          </button>
          <button id="sentimentBtn" class="btn btn-secondary">
            😊 Analyze Sentiment
          </button>
        </div>
      </div>

      <!-- Results Area -->
      <div id="results" class="section hidden">
        <h2 id="resultsTitle">Results</h2>
        <div id="resultsContent" class="results-content"></div>
      </div>

      <!-- Reply Context -->
      <div id="replyContext" class="section hidden">
        <h2>Generate Reply</h2>
        <textarea 
          id="contextInput" 
          placeholder="Add context for the reply (optional)..."
          rows="3"
        ></textarea>
        <div class="tone-selector">
          <label>Tone:</label>
          <select id="toneSelect">
            <option value="professional">Professional</option>
            <option value="semi-professional">Semi-Professional</option>
            <option value="casual">Casual</option>
            <option value="personal">Personal</option>
          </select>
        </div>
        <button id="generateBtn" class="btn btn-primary">Generate</button>
        <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
      </div>

      <!-- Settings Link -->
      <div class="footer">
        <button id="settingsBtn" class="btn-link">⚙️ Settings</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
